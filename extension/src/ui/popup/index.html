<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Control Settings</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --card-bg: rgba(30, 41, 59, 0.7);
      --border-color: rgba(99, 102, 241, 0.2);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-color: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.4);
      --accent-hover: #4f46e5;
    }

    body {
      margin: 0;
      padding: 16px;
      background: var(--bg-gradient);
      color: var(--text-main);
      font-family: system-ui, -apple-system, sans-serif;
      width: 280px;
      box-sizing: border-box;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    h3 {
      margin: 0;
      font-size: 1.1rem;
      background: linear-gradient(90deg, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
    }

    p {
      margin: 0;
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .btn {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 10px 16px;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    .btn:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .option-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 10px 12px;
      border-radius: 8px;
    }

    .option-label {
      font-size: 0.85rem;
      font-weight: 500;
    }

    /* Simple toggle switch styling */
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #475569;
      transition: .3s;
      border-radius: 20px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--accent-color);
    }

    input:checked + .slider:before {
      transform: translateX(16px);
    }
  </style>
</head>
<body>
  <div class="container">
    <div>
      <h3>Voice Controls</h3>
      <p>Configure and control browser hands-free.</p>
    </div>

    <button id="openSidepanel" class="btn">
      Open Voice Panel
    </button>

    <div class="option-row">
      <span class="option-label">Enable Audio Feedback</span>
      <label class="switch">
        <input type="checkbox" id="audioToggle" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="option-row">
      <span class="option-label">Parallel Mode (Active)</span>
      <label class="switch">
        <input type="checkbox" id="parallelToggle">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <script type="module" src="index.ts"></script>
</body>
</html>
