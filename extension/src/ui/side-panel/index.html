<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Browser Sidepanel</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --card-bg: rgba(30, 41, 59, 0.7);
      --border-color: rgba(99, 102, 241, 0.2);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-color: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.4);
      --success-color: #10b981;
    }

    body {
      margin: 0;
      padding: 16px;
      background: var(--bg-gradient);
      color: var(--text-main);
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    h1 {
      font-size: 1.25rem;
      margin: 0;
      background: linear-gradient(90deg, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
    }

    .mic-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      background: var(--card-bg);
      padding: 6px 12px;
      border-radius: 9999px;
      border: 1px solid var(--border-color);
    }

    .mic-status.listening {
      color: var(--success-color);
      border-color: var(--success-color);
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.2);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
    }

    .listening .status-dot {
      background: var(--success-color);
      animation: pulse 1.5s infinite;
    }

    .prompt-tip {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: center;
      padding: 8px;
      background: rgba(99, 102, 241, 0.05);
      border-radius: 8px;
      border: 1px dashed var(--border-color);
    }

    .output-card {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      backdrop-filter: blur(10px);
    }

    .card-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin: 0;
    }

    .transcript-box {
      flex: 1;
      overflow-y: auto;
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--text-main);
      white-space: pre-wrap;
    }

    .transcript-box:empty::before {
      content: "Speak by holding the Ctrl key...";
      color: var(--text-muted);
      font-style: italic;
    }

    .log-box {
      height: 120px;
      border-top: 1px solid var(--border-color);
      padding-top: 12px;
      font-family: monospace;
      font-size: 0.8rem;
      color: #38bdf8;
      overflow-y: auto;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.5; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.5; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Voice Control</h1>
      <div id="micStatus" class="mic-status">
        <span class="status-dot"></span>
        <span id="statusText">Idle</span>
      </div>
    </header>

    <div class="prompt-tip">
      Hold <strong>Ctrl</strong> to speak. Release to execute command.
    </div>

    <div class="output-card">
      <h2 class="card-title">Live Transcript</h2>
      <div id="transcriptBox" class="transcript-box"></div>
      
      <h2 class="card-title">Action Log</h2>
      <div id="logBox" class="log-box">Initialized...</div>
    </div>
  </div>

  <script type="module" src="index.ts"></script>
</body>
</html>
